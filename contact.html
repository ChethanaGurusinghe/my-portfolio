            crossorigin="anonymous">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <link rel="stylesheet" href="contact.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet">

    </head>
    <body>
        <div class="container-fluat" style="background-color: #9A0089;">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarText"
                        aria-controls="navbarText" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarText">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-auto">
                            <li class="nav-item">
                                <a class="nav-link active text-white p-3 mx-5"
                                    aria-current="page"
                                    href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white p-3 mx-5"
                                    href="about.html">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white p-3 mx-5"
                                    href="projects.html">Skills & Projects</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-black p-3 mx-5"
                                    href="#">Contact</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>

        <section id="contact" class="contact-section py-5">
            <div class="container">
                <h2 class="text-center mb-4">Contact Me</h2>
                <p class="text-center mb-5">
                    Feel free to reach out for collaborations, projects, or just
                    a friendly hello 🙂
                </p>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <form id="contact-form">

                            <div class="mb-3">
                                <label for="name" class="form-label">Your
                                    Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email
                                    Address</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="name@example.com"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="message"
                                    class="form-label">Message</label>
                                <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    rows="4"
                                    placeholder="Write your message..."
                                    required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Send Message
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </section>

        <footer class="custom-footer">
            <div class="container text-center py-4">

                <div class="mb-3">
                    <a href="https://www.linkedin.com" target="_blank"
                        class="social-icon me-3" aria-label="LinkedIn">
                        <i class="bi bi-linkedin"></i>
                    </a>
                    <a href="https://github.com" target="_blank"
                        class="social-icon" aria-label="GitHub">
                        <i class="bi bi-github"></i>
                    </a>
                </div>

                <div class="footer-text">
                    © 2025 Chethana Gurusinghe. All rights reserved.
                </div>

            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
        <script>
            (function () {
                emailjs.init("eyVaxXkOkrEpfudIQ");
            })();
        </script>

        <script>
        document.getElementById("contact-form").addEventListener("submit", function (e) {
        e.preventDefault();

        emailjs.sendForm(
            "service_cb3ghys",
            "template_eu7h4he",
            this
        ).then(
            function () {
                alert("Message sent successfully!");
                document.getElementById("contact-form").reset();
            },
            function (error) {
                alert("Message failed. Try again.");
                console.error(error);
            }
        );
    });
</script>

    </body>
</html>
